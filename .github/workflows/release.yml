name: release

# Tag-driven release of the skill-router binary for all target platforms via
# goreleaser, with a keyless (sigstore/cosign) signature over the checksums.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release + upload assets
  id-token: write # cosign keyless OIDC

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # full history for changelog + version

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: skill-router-cli/go.mod
          cache-dependency-path: skill-router-cli/go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Parity gate: refuse to release if the Go builder diverges from the Node
      # generator or the committed artifacts are stale.
      - name: Registry parity gate
        run: |
          cd skill-router-cli && go run . registry build --check
          cd "$GITHUB_WORKSPACE" && bash scripts/registry/parity-check.sh

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "v2.9.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set to publish the Homebrew tap formula.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
