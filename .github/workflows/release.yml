name: release

# Tag-driven release of the skill-router binary for all target platforms via
# goreleaser, with a keyless (sigstore/cosign) signature over the checksums.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release + upload assets
  id-token: write # cosign keyless OIDC

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for changelog + version

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: skill-router-cli/go.mod
          cache-dependency-path: skill-router-cli/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Parity gate: refuse to release if the Go builder diverges from the Node
      # generator or the committed artifacts are stale.
      - name: Registry parity gate
        run: |
          cd skill-router-cli && go run . registry build --check
          cd "$GITHUB_WORKSPACE" && bash scripts/registry/parity-check.sh

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "v2.20.3"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set to publish the Homebrew tap formula.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
