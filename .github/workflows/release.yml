name: release

# Tag-driven release of the skill-router binary for all target platforms via
# goreleaser, with a keyless (sigstore/cosign) signature over the checksums.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release + upload assets
  id-token: write # cosign keyless OIDC

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for changelog + version

      - uses: actions/setup-go@v5
        with:
          go-version-file: skill-router-cli/go.mod
          cache-dependency-path: skill-router-cli/go.sum

      # Refuse to release if the committed registry artifacts are stale. The Go
      # generator is the sole registry build (Node removed at cut-over Stage 5).
      - name: Registry drift gate (Go)
        run: cd skill-router-cli && go run . registry build --check

      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set to publish the Homebrew tap formula.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
