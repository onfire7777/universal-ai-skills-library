name: Security

# Secret scanning gate. Uses the repo's .gitleaks.toml, which allowlists the
# known-illustrative example/doc/vendored values catalogued in Scout 1's audit
# (scout1-secret-audit.md) so this fails on FUTURE real leaks, not on teaching
# examples. Pinned to the gitleaks version validated locally during setup.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree
        run: gitleaks detect --no-git --config .gitleaks.toml --redact --verbose --exit-code 1
