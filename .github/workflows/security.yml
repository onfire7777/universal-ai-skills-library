name: Security

# Secret scanning gate. Uses the repo's .gitleaks.toml, which allowlists the
# known-illustrative example/doc/vendored values catalogued in Scout 1's audit
# (scout1-secret-audit.md) so this fails on FUTURE real leaks, not on teaching
# examples. Pinned to the gitleaks version validated locally during setup.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Check out
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.4"

      - name: Install gitleaks
        run: |
          set -euo pipefail
          go install "github.com/zricethezav/gitleaks/v8@v${GITLEAKS_VERSION}"
          sudo install "$(go env GOPATH)/bin/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree
        run: gitleaks detect --no-git --config .gitleaks.toml --redact --verbose --exit-code 1
