name: Security

# Secret scanning gate. Uses the repo's .gitleaks.toml, which allowlists the
# known-illustrative example/doc/vendored values catalogued in Scout 1's audit
# (scout1-secret-audit.md) so this fails on FUTURE real leaks, not on teaching
# examples. Pinned to the gitleaks version validated locally during setup.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: skill-router-cli/go.mod
          cache-dependency-path: skill-router-cli/go.sum

      - name: Install gitleaks
        run: |
          set -euo pipefail
          go install "github.com/zricethezav/gitleaks/v8@v${GITLEAKS_VERSION}"
          sudo install "$(go env GOPATH)/bin/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree
        run: gitleaks detect --no-git --config .gitleaks.toml --redact --verbose --exit-code 1
