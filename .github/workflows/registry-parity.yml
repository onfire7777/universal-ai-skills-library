name: registry-parity

# Byte-parity oracle for the registry build. Runs on PRs that touch the corpus,
# the registry config/generator, the Go router, or any generated artifact. It
# enforces TWO things:
#   1. the Go builder agrees with the committed artifacts (the authoritative gate)
#   2. the Go builder is byte-identical to the legacy Node generator
# As of the Node→Go cut-over (Stage 3, docs/MIGRATION_NODE_TO_GO.md §5) the Go
# `registry build --check` is the authoritative gate (here and in
# characterization.yml); the Node generator is a non-blocking oracle. THIS job is
# what turns red if Go and Node ever disagree — the safety net that justifies
# keeping Node around through Stage 4.
on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/registry/**"
      - "skill-router-cli/**"
      - "manifest.json"
      - "docs/build_manifest.json"
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: skill-router-cli/go.mod
          cache-dependency-path: skill-router-cli/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Go registry build matches committed artifacts
        run: cd skill-router-cli && go run . registry build --check

      - name: Go output is byte-identical to the Node generator
        run: bash scripts/registry/parity-check.sh

      - name: Go registry unit tests
        run: cd skill-router-cli && go test ./internal/registry/...
