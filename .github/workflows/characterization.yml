name: Characterization

# Cross-cutting behavioural baseline for the skill-router + registry.
# Runs on Linux (fast, no PowerShell) and is complementary to ci.yml, which
# remains the Windows gate for the pwsh release-audit steps (see
# .github/workflows/README.md). This workflow stays green despite the small set
# of pre-existing Go failures: the Python suite gates on *no NEW* Go failures
# (subset of tests/characterization/baseline/go_known_failures.json) rather than
# requiring a fully-green Go suite pre-refactor.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  characterize:
    name: Router + registry characterization
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # 'stable' decouples CI from the router module's location so this
          # keeps working if the router is reorganised. The module's own
          # go.mod still pins the language version at build time.
          go-version: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Locate + build skill-router (once)
        run: |
          set -euo pipefail
          MOD_FILE=$(find . -name go.mod -path '*skill-router*' -not -path '*/node_modules/*' | head -1)
          if [ -z "$MOD_FILE" ]; then echo "::error::skill-router go.mod not found"; exit 1; fi
          MOD_DIR=$(dirname "$MOD_FILE")
          echo "Building router from $MOD_DIR"
          (cd "$MOD_DIR" && GOFLAGS=-mod=readonly go build -o "$GITHUB_WORKSPACE/skill-router" .)
          echo "SKILL_ROUTER_BIN=$GITHUB_WORKSPACE/skill-router" >> "$GITHUB_ENV"

      - name: Lint test sources (compile check)
        run: python3 -m compileall -q tests/characterization

      - name: Go vet (informational)
        continue-on-error: true
        run: |
          MOD_DIR=$(dirname "$(find . -name go.mod -path '*skill-router*' | head -1)")
          (cd "$MOD_DIR" && GOFLAGS=-mod=readonly go vet ./...)

      - name: Run characterization suite
        run: python3 -m unittest discover -s tests/characterization -p 'test_*.py' -v

      - name: Routing eval — baseline metrics gate (no regression)
        # Phase 0 of docs/ARCHITECTURE_IMPROVEMENT_PLAN.md (§3.5/§9.3): routing
        # changes are gated by metrics, not vibes. Reuses the router built above
        # (SKILL_ROUTER_BIN) and the isolated-but-live-corpus eval; fails only if
        # P@1 / MRR / Recall@5 / abstention REGRESS vs the committed baseline.
        run: python3 tests/routing-eval/run_eval.py --check

  registry-drift:
    name: Registry single-source drift guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build skill-router (Go owner of the build)
        run: |
          set -euo pipefail
          MOD_FILE=$(find . -name go.mod -path '*skill-router*' -not -path '*/node_modules/*' | head -1)
          if [ -z "$MOD_FILE" ]; then echo "::error::skill-router go.mod not found"; exit 1; fi
          MOD_DIR=$(dirname "$MOD_FILE")
          (cd "$MOD_DIR" && GOFLAGS=-mod=readonly go build -o "$GITHUB_WORKSPACE/skill-router" .)
          echo "SKILL_ROUTER_BIN=$GITHUB_WORKSPACE/skill-router" >> "$GITHUB_ENV"

      - name: Registry artifacts match single source (Go — AUTHORITATIVE)
        # Cut-over Stage 3 (docs/MIGRATION_NODE_TO_GO.md §5): the Go generator is
        # now the BLOCKING drift gate. Byte-checks all 4 registries (manifest.json,
        # marketplace.json, .agents/plugins/marketplace.json, docs/build_manifest.json)
        # against the single source of truth; exits 1 on drift.
        run: |
          "$SKILL_ROUTER_BIN" registry build --check

      - name: Registry artifacts match single source (Node — oracle, non-blocking)
        # Stage 4: the Node generator is retained as an independent parity oracle.
        # It still runs (so Go-vs-Node drift is visible) but no longer blocks; it is
        # removed entirely at Stage 5 after one clean release. If it ever disagrees
        # with Go, the byte-parity oracle in registry-parity.yml turns RED.
        continue-on-error: true
        run: node scripts/registry/generate-registry.mjs --check --optimize

      - name: Registry generator unit tests (Node oracle — non-blocking)
        continue-on-error: true
        run: node --test scripts/registry/lib/frontmatter.test.mjs scripts/registry/generate-registry.test.mjs

      - name: SKILL.md frontmatter schema
        # Validate every SKILL.md against schemas/skill.schema.json and fail closed
        # when malformed metadata would otherwise enter registry artifacts.
        run: node scripts/registry/validate-schema.mjs --error
